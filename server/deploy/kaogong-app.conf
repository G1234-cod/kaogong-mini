# Nginx 站点完整替换文件：/etc/nginx/conf.d/kaogong-app.conf
# app.gyx-a.cn：根路径 = 静态提示页（旧 PWA 已下线）；/api/ = 小程序后端（8000）
# 证书为 *.gyx-a.cn 泛域名，微信 request 合法域名配置 https://app.gyx-a.cn
server {
    listen 80;
    server_name app.gyx-a.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.gyx-a.cn;
    ssl_certificate     /etc/nginx/cert/wildcard.gyx-a.cn.pem;
    ssl_certificate_key /etc/nginx/cert/wildcard.gyx-a.cn.key;

    client_max_body_size 2m;

    # 小程序后端 API（FastAPI，uvicorn 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # B 端管理后台（admin/ 目录 vite build 产物上传到 /var/www/kaogong-admin/）
    # history 路由回退 index.html；/api 天然同源，无需 CORS
    location /admin/ {
        alias /var/www/kaogong-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 根路径：旧 PWA（3210）已下线，返回简单提示页
    location / {
        default_type text/html;
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考公小助手</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6fa;font-family:system-ui,-apple-system,sans-serif;color:#333}.card{background:#fff;border-radius:14px;padding:32px 28px;max-width:420px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}h1{font-size:20px;margin:0 0 12px;color:#4a5cf0}p{margin:8px 0;line-height:1.7;color:#666}a{color:#4a5cf0}</style></head><body><div class="card"><h1>考公小助手</h1><p>旧网页版已停止服务，小程序版已上线。</p><p>请在微信中搜索「考公小助手」使用。</p><p><a href="/admin/">管理后台</a></p></div></body></html>';
    }
}
