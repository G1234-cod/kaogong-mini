# Nginx 站点完整替换文件：/etc/nginx/conf.d/kaogong-app.conf
# app.gyx-a.cn：根路径 = PWA（3210，既有服务不动）；/api/ = 小程序后端（8000）
# 证书为 *.gyx-a.cn 泛域名，微信 request 合法域名配置 https://app.gyx-a.cn
server {
    listen 80;
    server_name app.gyx-a.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.gyx-a.cn;
    ssl_certificate     /etc/nginx/cert/wildcard.gyx-a.cn.pem;
    ssl_certificate_key /etc/nginx/cert/wildcard.gyx-a.cn.key;

    client_max_body_size 2m;

    # 小程序后端 API（FastAPI，uvicorn 127.0.0.1:8000）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
